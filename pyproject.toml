[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lotinha-analytics"
version = "0.1.0"
description = "Sistema de análise e predição de resultados da Lotinha"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # HTTP e retry
    "httpx>=0.27",
    "tenacity>=8.2",
    # Validação e configuração
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Banco de dados
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Análise e ML
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    # GUI
    "customtkinter>=5.2",
    # PDF
    "reportlab>=4.2",
    # Logging
    "loguru>=0.7",
    # CLI e rich output
    "click>=8.1",
    "rich>=13.7",
    # Matplotlib (gráficos embutidos na GUI e PDF)
    "matplotlib>=3.9",
]

[project.optional-dependencies]
selenium = [
    "selenium>=4.21",
    "webdriver-manager>=4.0",
]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
    "pandas-stubs>=2.2",
    "types-reportlab",
]

[project.scripts]
lotinha = "lotinha.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/lotinha"]

[tool.hatch.build.targets.sdist]
packages = ["src/lotinha"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "ANN",      # flake8-annotations (type hints)
    "RUF",      # ruff-specific rules
]
ignore = [
    "ANN401",  # Any em APIs públicas (necessário em alguns helpers)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"alembic/**" = ["ANN", "INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["alembic/", "tests/", "src/lotinha/gui/"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "reportlab.*",
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "-v",
    "--tb=short",
    "--cov=src/lotinha",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "integration: marca testes que chamam APIs reais (rodar com --run-integration)",
    "slow: testes lentos (ex: treino ML completo)",
]
filterwarnings = [
    "ignore::DeprecationWarning:lightgbm",
]

[tool.coverage.run]
source = ["src/lotinha"]
omit = [
    "src/lotinha/gui/*",
    "src/lotinha/extraction/selenium_fallback.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
